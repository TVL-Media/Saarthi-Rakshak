packages:
  - packages/shared
  - server
  - apps/admin

# Install scripts are blocked by default. These ship prebuilt binaries, so their scripts are not needed.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
  # firebase-admin dependencies: their install scripts are optional (a defaults file, a version notice).
  '@firebase/util': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/react-query@5.105.0'
  - antd@6.6.8
