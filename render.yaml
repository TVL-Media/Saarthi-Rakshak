# Render Blueprint: CLOSED TEST server for Sarthi Rakshak (NODE_ENV=development).
# Not for real users: guardian SMS are only printed in the Render logs, and Render has no India
# region (Singapore is used). Everything runs on Render, nothing else is needed.
# Step-by-step guide: docs/render-test-deploy.md
#
# One web service serves everything on one address: the API, the admin panel and the guardian
# pages (SERVE_WEB=on), so the admin login cookie and the guardian live updates work.
# "sync: false" values are typed in the Render dashboard (never put secrets in this file).

services:
  - type: web
    name: sarthi-rakshak-test
    runtime: node
    region: singapore
    # Free plan: sleeps after 15 min without traffic and takes ~1 min to wake. During an SOS or
    # journey the phone keeps it awake (a point every few seconds); the phone sends SIM SMS
    # itself if the server does not answer in 10 s. Use "starter" for an always-on server.
    plan: free
    healthCheckPath: /health
    autoDeploy: true # every push to the connected branch deploys
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter server build &&
      VITE_API_URL=$PUBLIC_URL pnpm --filter admin build &&
      pnpm --filter guardian-web exec vite build --base=/gw/
    # Database changes first, then the server (with the background worker inside).
    startCommand: cd server && node dist/database/migrate.js latest && node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: development
      - key: SERVE_WEB
        value: "on"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WORKER
        value: "on"
      - key: ADMIN_TWO_STEP
        value: "on" # public address: admins always use 2-step login
      # The service address, e.g. https://sarthi-rakshak-test.onrender.com (same value 3 times).
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PANEL_ORIGIN
        sync: false
      - key: GUARDIAN_WEB_URL
        sync: false
      # Database and Redis (made by this Blueprint). The *_TEST values are required by the
      # development settings check but are never used by the running server.
      - key: DATABASE_URL
        fromDatabase:
          name: sarthi-rakshak-test-db
          property: connectionString
      - key: DATABASE_URL_TEST
        fromDatabase:
          name: sarthi-rakshak-test-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sarthi-rakshak-test-redis
          property: connectionString
      - key: REDIS_URL_TEST
        fromService:
          type: keyvalue
          name: sarthi-rakshak-test-redis
          property: connectionString
      # Secrets: Render makes a random 256-bit base64 value for each (never the local ones).
      - key: ADMIN_TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_KEY
        generateValue: true
      - key: GUARDIAN_LINK_KEY
        generateValue: true
      # File storage (photos, audio): the SeaweedFS service below. S3_ENDPOINT is its address,
      # e.g. https://sarthi-rakshak-test-files.onrender.com (phones upload there directly).
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: sarthi-test-files
      - key: S3_ACCESS_KEY
        fromService:
          type: web
          name: sarthi-rakshak-test-files
          envVarKey: AWS_ACCESS_KEY_ID
      - key: S3_SECRET_KEY
        fromService:
          type: web
          name: sarthi-rakshak-test-files
          envVarKey: AWS_SECRET_ACCESS_KEY
      # App login with Firebase phone OTP. The key file is a Render "Secret File" named
      # firebase.json (Render puts it at /etc/secrets/firebase.json).
      - key: FIREBASE_PROJECT_ID
        value: sarthi-rakshak
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase.json
      # Optional test login for debug APKs (any number + this code, until the date). Anyone
      # with the code can log in as any number: share it only with your testers, keep it short.
      - key: DEV_LOGIN_CODE
        sync: false
      - key: DEV_LOGIN_UNTIL
        sync: false
      # Temporary admin password (test server only; the server refuses it in production).
      # Remove both before going live.
      - key: ADMIN_TEMP_EMAIL
        sync: false
      - key: ADMIN_TEMP_PASSWORD
        sync: false

  # File storage: SeaweedFS (the same as docker-compose locally) with an S3 API, on a disk.
  # Public on purpose: phones upload with short signed links; anything unsigned is refused.
  - type: web
    name: sarthi-rakshak-test-files
    runtime: image
    image:
      url: docker.io/chrislusf/seaweedfs:4.48
    region: singapore
    # Free plan has no disk: photos and audio are lost when this service sleeps or restarts.
    # For files that stay, use "starter" and add:  disk: {name: files, mountPath: /data, sizeGB: 10}
    plan: free
    # Render's Docker Command replaces the image's entrypoint, so call it here. Small volumes
    # (64 MB) keep memory use low on the free plan.
    dockerCommand: /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=20
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8333" # the S3 port is the only one Render makes public
      - key: AWS_ACCESS_KEY_ID
        value: sarthi_test
      - key: AWS_SECRET_ACCESS_KEY
        generateValue: true

  - type: keyvalue
    name: sarthi-rakshak-test-redis
    region: singapore
    plan: free # in memory only: waiting timers are lost on a restart (the 30 s sweep catches up)
    maxmemoryPolicy: noeviction # required by BullMQ: jobs must never be dropped
    ipAllowList: [] # only reachable from Render services

databases:
  - name: sarthi-rakshak-test-db
    region: singapore
    plan: free # 1 GB; Render deletes free databases 30 days after they are made
    postgresMajorVersion: "17" # PostGIS is enabled by the first database migration
    databaseName: sarthi
    user: sarthi
    ipAllowList: [] # only Render services (first admin: run setup in the web service's Shell)
