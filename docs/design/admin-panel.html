<title>Sarthi Rakshak Admin Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark navy sidebar + warm off-white work area; one screen at a time, picked from the strip on top.
   Single light look by choice: the Phase 1 admin panel has no dark mode. */
:root {
  --ink: #17191C;        /* main text */
  --muted: #5B5F66;      /* secondary text */
  --faint: #8A8E94;      /* hints, placeholders */
  --line: #E3E1DA;       /* borders */
  --line-soft: #EFEDE7;  /* table row lines */
  --page: #F5F4F0;       /* layout background */
  --card: #FFFFFF;       /* cards, inputs */
  --primary: #1D4E89;    /* buttons, links, focus */
  --primary-ink: #0F2F57;
  --primary-soft: #E8EEF6;
  --side: #14202B;       /* sidebar */
  --side-active: #2A3B4B;
  --side-text: #D7DEE5;
  --side-muted: #8396A7;
  --sos: #B42318;        /* SOS + errors only */
  --sos-soft: #FDECEA;
  --ok: #166534;
  --ok-soft: #E7F4EC;
  --warn: #9A5B00;
  --warn-soft: #FFF8E6;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;              /* inputs, buttons */
  --r-card: 12px;        /* cards */
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- design-reference strip (not part of the panel) ---------- */
.ref { background: var(--card); border-bottom: 1px solid var(--line); padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.ref-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.ref-top b { font-size: 15px; }
.ref-top span { color: var(--muted); font-size: 13px; }
.ref-groups { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ref-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ref-group > span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--primary); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.note { margin: 16px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--warn-soft); border: 1px dashed #E2C68A; color: #5A3D00; border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.note b { color: #3B2A00; }

/* ---------- auth screens ---------- */
.auth { min-height: 720px; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 32px; display: flex; flex-direction: column; gap: 20px; }
.auth-card.wide { max-width: 560px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-size: 16px; letter-spacing: .04em; }
.brand span { font-size: 13px; color: var(--muted); }
.auth-card h1 { font-size: 22px; }
.auth-card p { margin: 0; color: var(--muted); }
.auth-foot { font-size: 12px; color: var(--faint); text-align: center; max-width: 420px; }
.auth-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }

/* ---------- form parts (map to Ant Design Form, Input, Button) ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; }
.field small { color: var(--muted); font-size: 12px; }
.input { height: 40px; border: 1px solid #D6D3CB; border-radius: var(--r); padding: 0 12px; background: var(--card); color: var(--ink); width: 100%; }
.input:focus { border-color: var(--primary); outline: 3px solid var(--primary-soft); }
.input.err { border-color: var(--sos); }
.err-text { color: var(--sos); font-size: 12px; }
.btn { height: 40px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #FFFFFF; }
.btn.primary:hover { background: var(--primary-ink); }
.btn.danger { background: var(--card); border-color: var(--sos); color: var(--sos); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { color: var(--primary); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; }
.alert { border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.alert.error { background: var(--sos-soft); color: #7A1810; }
.alert.info { background: var(--primary-soft); color: var(--primary-ink); }
.alert.warn { background: var(--warn-soft); color: #5A3D00; }
.alert.ok { background: var(--ok-soft); color: #0F4A26; }
.otp { display: flex; gap: 8px; }
.otp .input { width: 44px; height: 48px; text-align: center; font-family: var(--mono); font-size: 20px; padding: 0; }
.steps { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
.steps span { flex: 1; border-top: 3px solid var(--line); padding-top: 6px; }
.steps span.on { border-color: var(--primary); color: var(--ink); font-weight: 600; }
.qr-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
.qr { width: 160px; height: 160px; border: 1px solid var(--line); border-radius: var(--r); display: grid; place-items: center; color: var(--faint); font-size: 12px; text-align: center; padding: 12px; background: repeating-linear-gradient(45deg, #FAFAF8 0 8px, #F1F0EC 8px 16px); flex: none; }
.qr-side { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.key { font-family: var(--mono); background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; word-break: break-all; color: var(--muted); }
.codes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; background: var(--page); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.codes span { font-family: var(--mono); color: var(--faint); letter-spacing: .06em; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.rules { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; display: grid; gap: 2px; }

/* ---------- app shell (Ant Design Layout: Sider + Header + Content) ---------- */
.shell { display: flex; min-height: 820px; }
.side { width: 232px; flex: none; background: var(--side); color: var(--side-text); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
.side .brand { padding: 0 10px 20px; }
.side .brand b { color: #FFFFFF; }
.side .brand span { color: var(--side-muted); }
.nav { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: var(--r); color: var(--side-text); text-decoration: none; font-size: 14px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: #1D2C3A; }
.nav.on { background: var(--side-active); color: #FFFFFF; font-weight: 600; }
.nav-head { margin: 16px 12px 6px; font-size: 11px; letter-spacing: .08em; color: var(--side-muted); }
.side-foot { margin-top: auto; padding: 16px 12px 0; font-size: 12px; color: var(--side-muted); border-top: 1px solid #22313F; }
.pill-count { background: var(--sos); color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { height: 60px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px; }
.top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--page); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.role { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.who-text { display: flex; flex-direction: column; line-height: 1.25; }
.who-text small { color: var(--muted); font-size: 12px; }
.menu-btn { display: none; }
.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.page-head h1 { font-size: 24px; font-weight: 700; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat b { font-family: var(--mono); font-size: 26px; font-weight: 500; }
.stat.sos b { color: var(--sos); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; }
.filters .input, .filters select { width: auto; min-width: 150px; flex: 1 1 150px; }
select.input { padding-right: 8px; }

/* tables: Ant Design Table; header row + empty state */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); background: #FAFAF8; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.ph { color: var(--faint); font-family: var(--mono); }

/* empty / loading / error states */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 36px 16px; color: var(--muted); }
.empty-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--page); border: 1px solid var(--line); display: grid; place-items: center; margin-bottom: 4px; }
.empty-icon svg { width: 20px; height: 20px; stroke: var(--faint); fill: none; stroke-width: 1.8; }
.empty b { color: var(--ink); font-size: 14px; }
.empty p { margin: 0; max-width: 46ch; font-size: 13px; }
.skel { background: linear-gradient(90deg, #EFEDE7 25%, #F7F6F2 50%, #EFEDE7 75%); background-size: 200% 100%; border-radius: 6px; height: 14px; animation: shimmer 1.4s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.map { min-height: 260px; border-radius: var(--r); border: 1px solid var(--line); background-color: #E9EEF0; background-image: linear-gradient(#D5DDE1 1px, transparent 1px), linear-gradient(90deg, #D5DDE1 1px, transparent 1px); background-size: 48px 48px; display: grid; place-items: center; }
.map .empty { background: rgba(255,255,255,.88); border-radius: var(--r); padding: 18px 22px; }

/* status rows (system health, providers) */
.status-list { display: flex; flex-direction: column; }
.status-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.status-row:last-child { border-bottom: 0; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--sos-soft); color: var(--sos); }
.badge.off { background: var(--page); color: var(--muted); }

/* settings form */
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 20px; }
.unit { display: flex; align-items: stretch; }
.unit .input { border-radius: var(--r) 0 0 var(--r); font-family: var(--mono); }
.unit span { border: 1px solid #D6D3CB; border-left: 0; border-radius: 0 var(--r) var(--r) 0; background: #FAFAF8; padding: 0 10px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.sticky-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; }

/* modal (Ant Design Modal) shown inline in the reference */
.modal-back { background: rgba(20,32,43,.45); border-radius: var(--r-card); padding: 40px 16px; display: grid; place-items: center; }
.modal { background: var(--card); border-radius: var(--r-card); width: 100%; max-width: 460px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; }

/* theme sheet */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.sw i { display: block; height: 52px; }
.sw div { padding: 8px 10px; display: flex; flex-direction: column; font-size: 12px; }
.sw code { font-family: var(--mono); color: var(--muted); }
.type-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.type-row code { font-family: var(--mono); font-size: 12px; color: var(--muted); width: 190px; flex: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

@media (max-width: 860px) {
  .side { display: none; }
  .menu-btn { display: inline-flex; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .top { padding: 0 16px; }
  .content { padding: 16px; }
  .who-text { display: none; }
  .auth-card { padding: 22px; }
}
</style>

<div class="ref" role="navigation" aria-label="Design screens">
  <div class="ref-top"><b>Sarthi Rakshak · Admin panel design</b><span>Source of truth for the admin UI. Pick a screen. Text in {braces} is filled from the server.</span></div>
  <div class="ref-groups" id="picker"></div>
</div>
<div class="note" id="note"></div>
<div id="stage"></div>

<script>
const ICON = {
  inbox: '<path d="M3 13h5l1.5 2.5h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
  sos: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.5M3.5 12h.5M3.5 18h.5"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5v.5"/>'
};
const empty = (icon, title, text) =>
  `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[icon]}</svg></div><b>${title}</b><p>${text}</p></div>`;
const table = (cols, body) =>
  `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body ? body : `<tr><td colspan="${cols.length}" style="white-space:normal">${''}</td></tr>`}</tbody></table></div>`;
const emptyTable = (cols, icon, title, text) =>
  `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody><tr><td colspan="${cols.length}" style="white-space:normal">${empty(icon, title, text)}</td></tr></tbody></table></div>`;
const brand = (dark) => `<div class="brand"><b>SARTHI RAKSHAK</b><span>Admin · Noida pilot</span></div>`;
const authFoot = `<p class="auth-foot">For authorised client staff only. Every view and action in this panel is recorded.</p>`;

/* ---------------- auth screens ---------------- */
const AUTH = {
  login: {
    label: 'Log in',
    note: '<b>Route /login.</b> After a correct password the server returns "needs 2-step" (go to 2-step code) or "must change password" (first login). The server sends one reply for wrong details and for a locked account (so nobody can tell which emails exist): always show this one red message. Never say which of email or password was wrong.',
    html: `<div class="auth"><div class="auth-wrap"><form class="auth-card" onsubmit="event.preventDefault()">
      ${brand()}
      <div><h1>Log in</h1><p>Use the email your Super Admin added you with.</p></div>
      <div class="alert error" role="alert">Email or password is wrong. After 5 wrong tries the account is locked for 15 minutes.</div>
      <div class="field"><label for="l-email">Email</label><input id="l-email" class="input err" type="email" autocomplete="username" placeholder="name@company.in"></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" class="input err" type="password" autocomplete="current-password"></div>
      <button class="btn primary block" type="submit">Log in</button>
      <p style="font-size:13px">Forgot your password? Ask a Super Admin to reset it.</p>
    </form>${authFoot}</div></div>`
  },
  locked: {
    label: 'Too many tries',
    note: '<b>Login error state</b> (same screen, alert above the fields) when the server refuses because of too many tries from this network (429). Warning style, not red. Fields stay enabled. There is no separate "account locked" message: a locked account gets the normal wrong-details message.',
    html: `<div class="auth"><div class="auth-wrap"><form class="auth-card" onsubmit="event.preventDefault()">
      ${brand()}
      <div><h1>Log in</h1><p>Use the email your Super Admin added you with.</p></div>
      <div class="alert warn" role="alert">Too many login tries from this network. Wait 15 minutes and try again.</div>
      <div class="field"><label for="k-email">Email</label><input id="k-email" class="input" type="email"></div>
      <div class="field"><label for="k-pass">Password</label><input id="k-pass" class="input" type="password"></div>
      <button class="btn primary block" type="submit">Log in</button>
    </form>${authFoot}</div></div>`
  },
  password: {
    label: 'Change password',
    note: '<b>Route /change-password.</b> Shown when logging in with a temporary password (from the setup command or a reset). The rules list must match the server rules. Rules turn green as they are met (the last two are checked by the server and shown as an error under the field if broken).',
    html: `<div class="auth"><div class="auth-wrap"><form class="auth-card" onsubmit="event.preventDefault()">
      ${brand()}
      <div class="steps"><span class="on">1 · New password</span><span>2 · 2-step setup</span><span>3 · Backup codes</span></div>
      <div><h1>Set your own password</h1><p>You logged in with a temporary password. Choose a new one to continue.</p></div>
      <div class="field"><label for="p-new">New password</label><input id="p-new" class="input" type="password" autocomplete="new-password">
        <ul class="rules"><li>At least 12 characters</li><li>Not the same as the temporary password</li><li>Does not contain the name part of your email</li></ul></div>
      <div class="field"><label for="p-again">Type it again</label><input id="p-again" class="input" type="password" autocomplete="new-password"></div>
      <button class="btn primary block" type="submit">Save password</button>
    </form>${authFoot}</div></div>`
  },
  setup: {
    label: '2-step setup',
    note: '<b>Route /two-step/setup.</b> Every admin must set this up before seeing any data. The QR code and key come from the server once. The 6-digit code is checked before moving on. Wrong code: "That code didn\'t work. Check the time on your phone and try the newest code."',
    html: `<div class="auth"><div class="auth-wrap"><form class="auth-card wide" onsubmit="event.preventDefault()">
      ${brand()}
      <div class="steps"><span class="on">1 · New password</span><span class="on">2 · 2-step setup</span><span>3 · Backup codes</span></div>
      <div><h1>Turn on 2-step login</h1><p>Each time you log in you'll also enter a code from an authenticator app on your phone, such as Google Authenticator or Microsoft Authenticator.</p></div>
      <div class="qr-row">
        <div class="qr" role="img" aria-label="QR code from the server">QR code<br>from server</div>
        <div class="qr-side">
          <b>1. Scan this QR code</b>
          <p style="font-size:13px">Open your authenticator app, tap “Add”, and scan. Can't scan? Type this key instead:</p>
          <div class="key">{setup key from server}</div>
          <button class="link" type="button" style="align-self:flex-start">Copy key</button>
        </div>
      </div>
      <div class="field"><label for="s-c1">2. Enter the 6-digit code from the app</label>
        <div class="otp">${[1,2,3,4,5,6].map(i => `<input id="s-c${i}" class="input" inputmode="numeric" maxlength="1" aria-label="Digit ${i}">`).join('')}</div></div>
      <button class="btn primary block" type="submit">Turn on 2-step login</button>
    </form>${authFoot}</div></div>`
  },
  codes: {
    label: 'Backup codes',

function shell(key, page) {
  const navKey = page.nav || key;
  const role = page.role || 'Super Admin';
  const item = ([k, l]) => `<button class="nav${k === navKey ? ' on' : ''}" type="button" data-go="${k}"><span>${l}</span></button>`;
  return `<div class="shell">
    <nav class="side" aria-label="Admin sections">${brand()}
      ${NAV.map(item).join('')}
      ${role === 'Super Admin' ? `<div class="nav-head">SUPER ADMIN ONLY</div>${NAV_SUPER.map(item).join('')}` : ''}
      <div class="side-foot">Auto logout after 30 min without activity</div>
    </nav>
    <div class="body">
      <header class="top"><div class="top-left"><button class="btn menu-btn" type="button" aria-label="Open menu">Menu</button><span class="tag">Noida pilot</span></div>
        <div class="who"><div class="avatar" aria-hidden="true">{AB}</div><div class="who-text"><b>{admin name}</b><small>${role}</small></div><button class="btn" type="button">Log out</button></div></header>
      <main class="content">
        <div class="page-head"><div><h1>${page.title}</h1>${page.sub ? `<p>${page.sub}</p>` : ''}</div></div>
        ${page.html}
      </main>
    </div></div>`;
}

  const s = ALL[key];
  document.getElementById('note').innerHTML = s.note;
  const stage = document.getElementById('stage');
  stage.innerHTML = key === 'theme' ? s.html() : (AUTH[key] ? s.html : shell(key, s));
  document.querySelectorAll('[data-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === key)));
  stage.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}
function go(key) { try { history.replaceState(null, '', '#' + key); } catch (e) {} show(key); window.scrollTo(0, 0); }

document.getElementById('picker').innerHTML = GROUPS.map(([g, set]) =>
  `<div class="ref-group"><span>${g}</span>${Object.entries(set).map(([k, v]) => `<button class="chip" type="button" data-pick="${k}">${v.label}</button>`).join('')}</div>`).join('');
document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => go(b.dataset.pick)));
show((location.hash || '#login').slice(1));
</script>
