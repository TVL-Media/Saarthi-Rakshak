# Local development services: PostgreSQL + PostGIS, Redis and SeaweedFS (S3-compatible file storage).
# Settings come from .env (copy .env.example to .env first).
name: sarthi-rakshak

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sarthi_pgdata:/var/lib/postgresql/data
      # Runs only the first time the data volume is created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - sarthi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # File storage for photos and audio, S3-compatible. Stands in for DigitalOcean Spaces locally.
  # (MinIO was the first choice, but its Docker image is no longer published.)
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-sarthi_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change_me_local_only}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - sarthi_storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  sarthi_pgdata:
  sarthi_redisdata:
  sarthi_storagedata:
